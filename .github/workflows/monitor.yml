name: Monitor LFR

# Monitor TYLKO powiadamia (Telegram) – nigdy nie wysyła wniosków ani maili do fundacji.

on:
  schedule:
    # Co 10 minut, w minutach 2, 12, 22, 32, 42, 52 (unikamy pełnej godziny – wtedy
    # GitHub ma największy tłok i najdłuższe opóźnienia). Cron w GitHub Actions działa
    # ZAWSZE w UTC; przy „co 10 minut” strefa nie ma znaczenia – patrz README.
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Wyślij TYLKO testowy alert PILNY (sprawdzenie, czy Telegram dociera na telefon)"
        type: boolean
        default: false

permissions:
  contents: write # commit pliku stanu

# Przebiegi nie nakładają się; trwający nie jest anulowany przez następny.
concurrency:
  group: monitor-lfr
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # `ref` = CZUBEK gałęzi w chwili startu, a nie github.sha z chwili wywołania.
      # Przebieg czekający w kolejce concurrency ma github.sha sprzed commitu stanu
      # poprzedniego przebiegu – czytałby stary stan.json i wysłał te same alerty drugi raz.
      - name: Pobierz repozytorium
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python 3.12 (z cache pip)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Zainstaluj zależności
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # Dziennik sprawdzeń (state/log.jsonl) dostaje wpis w KAŻDYM przebiegu, ale commit
      # robimy tylko przy zmianie stanu – między commitami dziennik przenosi cache.
      - name: Przywróć dziennik sprawdzeń z poprzedniego przebiegu
        uses: actions/cache/restore@v5
        with:
          path: state/log.jsonl
          key: log-sprawdzen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: log-sprawdzen-

      - name: Testowy alert PILNY
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor_lfr --test-alert

      - name: Sprawdź stronę LFR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_alert) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m monitor_lfr

      - name: Zapisz dziennik sprawdzeń (cache)
        if: ${{ always() && hashFiles('state/log.jsonl') != '' }}
        uses: actions/cache/save@v5
        with:
          path: state/log.jsonl
          key: log-sprawdzen-${{ github.run_id }}-${{ github.run_attempt }}

      # Commit tylko, gdy zmienił się state/stan.json (nowa wersja strony, alert,
      # przypomnienie, licznik błędów, heartbeat) – oraz raz na dobę dzięki znacznikowi
      # „znacznik_zycia”, żeby GitHub nie wyłączył harmonogramu po 60 dniach bez aktywności.
      - name: Commit stanu (tylko gdy stan.json się zmienił)
        if: ${{ always() }}
        run: |
          if [ -z "$(git status --porcelain -- state/stan.json)" ]; then
            echo "Stan bez zmian – brak commitu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/stan.json state/log.jsonl
          git commit -m "stan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Ktoś wypchnął coś w trakcie przebiegu -> rebase na czubek gałęzi. Przy konflikcie
          # w plikach stanu wygrywa wersja z TEGO przebiegu (-X theirs w rebase = commit,
          # który przenosimy): to ona pamięta alerty wysłane przed chwilą.
          for proba in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            # Przerwany rebase zostawia repozytorium „w trakcie” – bez tego kolejne próby nie mają szans.
            git rebase --abort 2>/dev/null || true
            echo "Push nieudany (próba ${proba}/3) – ponawiam za 5 s."
            sleep 5
          done
          exit 1
